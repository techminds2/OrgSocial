services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: shishir
      MINIO_ROOT_PASSWORD: shishir#123
    volumes:
      - ./frontend-test-bucket:/data   # << use your existing bucket folder
